<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171522">
  <meta name="description" content="Interactive jazz piano ear training for chord qualities, intervals, and spaced review.">
  <title>Blue Note · Jazz Ear Training</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js?v=2"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 10v4m4-7v10m5-14v18m5-14v10m4-7v4"/></symbol>
    <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3M4 13h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 1 1-2Zm16 0h-2a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-2a2 2 0 0 0-1-2Z"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M20 10a8 8 0 0 0-14-3L3 10m0 0V5m0 5h5m-4 4a8 8 0 0 0 14 3l3-3m0 0v5m0-5h-5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16M9 15v-3m5 3V8m5 7v-5"/></symbol>
    <symbol id="i-piano" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v9m6-9v9M9 16v3m6-3v3"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3V9Zm13 0a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l12-7Z" fill="currentColor" stroke-width="0"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h6m4 0h6M4 12h10m4 0h2M4 18h2m4 0h10M10 4v4m8 2v4M6 16v4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 5 5L19 8"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".7"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="16" rx="3" ry="2"/></symbol>
    <symbol id="i-interval" viewBox="0 0 24 24"><path d="M3 17h7m4-10h7M7 13v-3l5-3m5 4v3l-5 3"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="7" r="2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4m8-4v4M4 10h16"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon"><svg><use href="#i-wave"></use></svg></span>
      <div><span class="brand-name">Blue Note</span><span class="brand-detail">JAZZ EAR TRAINING</span></div>
    </div>
    <nav aria-label="Studio">
      <div class="nav-label">STUDIO</div>
      <button class="nav-item active" data-view="practice"><svg><use href="#i-headphones"></use></svg>Practice</button>
      <button class="nav-item" data-view="review"><svg><use href="#i-repeat"></use></svg>Review <span class="due-count" id="nav-due" hidden></span></button>
      <button class="nav-item" data-view="progress"><svg><use href="#i-chart"></use></svg>Progress</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="midi-box">
        <div class="midi-heading"><svg><use href="#i-piano"></use></svg><span>MIDI keyboard</span></div>
        <p id="midi-status" role="status">Ready to connect</p>
        <button type="button" id="midi-connect">Connect MIDI</button>
      </div>
    </div>
  </aside>
  <main class="workspace" id="workspace"></main>
</body>
</html>
